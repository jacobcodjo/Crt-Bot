name: CRT Trading Bot Scan

on:
  workflow_dispatch: {}       # déclenché toutes les 5 min par un cronjob externe (cron-job.org)

permissions:
  contents: write

concurrency:
  group: crt-scan
  cancel-in-progress: false   # met en file d'attente plutôt que d'annuler un scan en cours

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # sécurité : un run qui traîne ne doit jamais bloquer la file d'attente
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CRT scan
        env:
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "crt-bot"
          git config user.email "crt-bot@users.noreply.github.com"
          git add state.json trade_stats.json
          if git diff --quiet --cached; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3 4 5; do
            # -X ours : en cas de conflit (ex: state.json modifié à la main entre
            # temps), on garde automatiquement la version de CE run plutôt que
            # d'échouer -- ces fichiers sont générés par le bot, pas censés être
            # fusionnés ligne à ligne comme du texte.
            git pull --rebase -X ours origin main && git push && exit 0
            echo "Push échoué (tentative $i), nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "Échec du push après plusieurs tentatives." >&2
          exit 1
