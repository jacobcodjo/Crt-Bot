name: CRT Trading Bot Scan

on:
  workflow_dispatch: {}       # déclenché toutes les 5 min par un cronjob externe (cron-job.org)

permissions:
  contents: write

concurrency:
  group: crt-scan
  cancel-in-progress: false   # met en file d'attente plutôt que d'annuler un scan en cours

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CRT scan
        env:
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "crt-bot"
          git config user.email "crt-bot@users.noreply.github.com"
          git add state.json trade_stats.json
          git diff --quiet --cached || git commit -m "Update state [skip ci]"
          git pull --rebase origin main
          git push
